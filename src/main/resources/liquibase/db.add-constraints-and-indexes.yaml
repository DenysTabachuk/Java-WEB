databaseChangeLog:
  - changeSet:
      id: add-constraints-and-indexes
      author: DenysTabachuk
      changes:
        - addForeignKeyConstraint:
            baseTableName: order_item
            baseColumnNames: order_id
            referencedTableName: space_order
            referencedColumnNames: id
            constraintName: fk_order_item_order
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: order_item
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
            constraintName: fk_order_item_product
            onDelete: CASCADE

        - createIndex:
            tableName: order_item
            indexName: idx_order_item_order
            columns:
              - column:
                  name: order_id
        - sql:
            sql: >
              ALTER TABLE order_item
              ADD CONSTRAINT chk_order_item_quantity_gt_zero
              CHECK (quantity > 0);