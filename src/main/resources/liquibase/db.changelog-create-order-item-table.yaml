databaseChangeLog:
  - changeSet:
      id: creat-order-product
      author: DenysTabachuk
      changes:
        - createTable:
            tableName: "order_item"
            columns:
              - column:
                  name: "id"
                  type: "uuid"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "order_id"
                  type: "uuid"
                  constraints:
                    nullable: false
              - column:
                  name: "product_id"
                  type: "uuid"
                  constraints:
                    nullable: false
              - column:
                  name: "quantity"
                  type: "integer"
                  constraints:
                    nullable: false
              - column:
                  name: "price"
                  type: "integer"
